<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel | Gabs Scrubs</title><link rel="stylesheet" href="admin.css"><script defer src="admin.js"></script></head><body>
<header><a class="brand" href="/loja/index.html">GABS SCRUBS</a><nav><a href="/loja/index.html" target="_blank" rel="noopener">Ver loja</a><button id="logout" hidden>Sair</button></nav></header>
<main><p id="notice" role="status" aria-live="polite"></p><section id="login" class="login panel"><span class="eyebrow">ACESSO ADMINISTRATIVO</span><h1>Seu catálogo.<br>Do seu jeito.</h1><form id="login-form"><label>Usuário<input id="user" autocomplete="username" required maxlength="100"></label><label>Senha<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button id="enter">Entrar</button></form></section>
<section id="workspace" hidden><div class="page-heading"><div><span class="eyebrow">PAINEL GABS</span><h1>Catálogo</h1></div><span id="count"></span></div><div class="layout"><section class="panel"><h2 id="form-title">Novo produto</h2><form id="product-form"><label>Nome do produto<input name="name" required maxlength="120" placeholder="Ex.: Scrub Gabs Marinho"></label><div class="columns"><label>Categoria<select name="category"><option value="scrubs">Scrub</option><option value="jalecos">Jaleco</option><option value="conjuntos">Conjunto</option></select></label><label>Coleção<select name="gender"><option value="feminino">Feminino</option><option value="masculino">Masculino</option><option value="unissex">Unissex</option></select></label><label>Preço (R$)<input name="price" required inputmode="decimal" placeholder="289,90"></label><label>Modelagem<select name="fit"><option>Modelagem Slim</option><option>Modelagem Straight</option><option>Modelagem Relaxed</option><option>Alfaiataria leve</option></select></label></div>
<fieldset><legend>Tamanhos disponíveis</legend><div class="sizes"><label><input type="checkbox" name="sizes" value="PP">PP</label><label><input type="checkbox" name="sizes" value="P">P</label><label><input type="checkbox" name="sizes" value="M">M</label><label><input type="checkbox" name="sizes" value="G">G</label><label><input type="checkbox" name="sizes" value="GG">GG</label><label><input type="checkbox" name="sizes" value="XGG">XGG</label></div></fieldset>
<fieldset><legend>Cores</legend><div id="colors"></div><button type="button" id="add-color" class="secondary">Adicionar cor</button></fieldset>
<label>Descrição<textarea name="description" rows="4" required maxlength="2000"></textarea></label><label>Tecido<textarea name="fabric" rows="2" maxlength="2000"></textarea></label><label>Detalhes<textarea name="details" rows="2" maxlength="2000"></textarea></label>
<label class="upload">Fotos do produto<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><span>Até 10 fotos · JPG, PNG ou WebP · até 10 MB cada. A primeira foto será a capa.</span></label><div id="preview" class="photos"></div><div class="actions"><button id="save">Revisar publicação</button><button type="button" id="cancel" class="secondary" hidden>Cancelar edição</button></div></form></section>
<section class="panel catalog"><h2>Produtos cadastrados</h2><div id="list"></div></section></div></section></main>
<dialog id="review"><div class="dialog-content"><h2>Revisar produto</h2><div id="review-summary"></div><div id="review-photos" class="photos"></div><div class="actions"><button id="confirm">Confirmar publicação</button><button id="back" class="secondary">Voltar e editar</button></div></div></dialog></body></html>
